    line-height: 1.2 !important;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  /* ★修正: 中のアイコンや文字がクリックを邪魔しないようにする */
  .qr-toggle-btn * {
    pointer-events: none;
  }

  /* ★修正: inputを完全に消さず、label全体をカバーするように透明で重ねる */
  .show-member-qr-toggle {
    position: absolute !important;
    top: 0;
    left: 0;
    width: 100% !important;
    height: 100% !important;
    opacity: 0 !important;
    margin: 0 !important;
    cursor: pointer !important;
    pointer-events: auto !important; /* クリックを直接受け取る */

  }

  /* デフォルト状態: 非表示だがdisplay:noneは使わない */
  .mypage-content {
    opacity: 0;
    visibility: hidden;
    max-height: 0;
    overflow: hidden;
    transform: translateY(-12px);
    transition:
      opacity 0.35s ease,
      transform 0.35s ease,
      max-height 0.35s ease,
      visibility 0s linear 0.35s; /* visibilityだけ最後に切り替える */
  }

  /* チェックが入ったら表示 */
  body:has(.show-member-qr-toggle:checked) .mypage-content {
    opacity: 1;
    visibility: visible;
    max-height: 500px; /* QRの実際の高さより少し大きめに */

    transition:

      transform 0.35s ease,
      max-height 0.35s ease,
